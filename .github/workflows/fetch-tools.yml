# Run once from the Actions tab ("fetch tools" → Run workflow).
# The cloud render sessions can't reach these downloads, so this stores them in the repo:
#   vendor/ffmpeg/          ffmpeg 7.1 + ffprobe (BtbN static build), split into 90 MB parts
#   vendor/whisper-base.en/ faster-whisper base.en model, for the speech check and word timings
name: fetch tools
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg 7.1
        run: |
          curl -sSL --fail -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-linux64-gpl-7.1.tar.xz
          tar -xf ff.tar.xz
          mkdir -p vendor/ffmpeg
          split -b 90m -d ffmpeg-n7.1*/bin/ffmpeg  vendor/ffmpeg/ffmpeg.part
          split -b 90m -d ffmpeg-n7.1*/bin/ffprobe vendor/ffmpeg/ffprobe.part
          ffmpeg-n7.1*/bin/ffmpeg -version | head -1 > vendor/ffmpeg/VERSION
          rm -rf ff.tar.xz ffmpeg-n7.1*
      - name: whisper base.en
        run: |
          pip install -q huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-base.en', local_dir='vendor/whisper-base.en')"
          rm -rf vendor/whisper-base.en/.cache
          cd vendor/whisper-base.en && split -b 90m -d model.bin model.bin.part && rm model.bin
      - name: commit
        run: |
          git config user.name "lnl-stories bot"
          git config user.email "actions@users.noreply.github.com"
          git add vendor
          git commit -m "Add ffmpeg 7.1 and whisper base.en for cloud renders" || echo "nothing new"
          git push
