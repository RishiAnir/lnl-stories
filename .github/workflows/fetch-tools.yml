# Run once from the Actions tab ("fetch tools" → Run workflow).
# The cloud render sessions can't reach these downloads, so this stores them in the repo:
#   vendor/ffmpeg/          ffmpeg 7+ and ffprobe (BtbN static build), split into 90 MB parts
#   vendor/whisper-small.en/ faster-whisper small.en model, for the speech check and word timings
name: fetch tools
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg 7+
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BtbN renames its release files when FFmpeg versions change, so look the name up
          # instead of hard-coding it: newest static (non-shared) linux64 GPL build of a release branch.
          NAME=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name' \
                 | grep -E '^ffmpeg-n[0-9]+\.[0-9]+-latest-linux64-gpl-[0-9.]+\.tar\.xz$' | sort -V | tail -1)
          [ -n "$NAME" ] || NAME=ffmpeg-master-latest-linux64-gpl.tar.xz
          echo "using $NAME"
          gh release download latest -R BtbN/FFmpeg-Builds -p "$NAME" -O ff.tar.xz
          mkdir ff && tar -xf ff.tar.xz -C ff --strip-components=1
          ff/bin/ffmpeg -version | head -1 | tee VERSION.txt
          mkdir -p vendor/ffmpeg && mv VERSION.txt vendor/ffmpeg/VERSION
          split -b 90m -d ff/bin/ffmpeg  vendor/ffmpeg/ffmpeg.part
          split -b 90m -d ff/bin/ffprobe vendor/ffmpeg/ffprobe.part
          rm -rf ff ff.tar.xz
      - name: whisper small.en
        run: |
          pip install -q huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small.en', local_dir='vendor/whisper-small.en')"
          rm -rf vendor/whisper-small.en/.cache
          cd vendor/whisper-small.en && split -b 90m -d model.bin model.bin.part && rm model.bin
      - name: commit
        run: |
          git config user.name "lnl-stories bot"
          git config user.email "actions@users.noreply.github.com"
          git add vendor
          git commit -m "Add ffmpeg 7.1 and whisper small.en for cloud renders" || echo "nothing new"
          git push
