# Rebuilds the live dashboard (scripts/dashboard.py) and pushes it to the public RishiAnir/lnl-dashboard repo (GitHub Pages).
# Needs the DASHBOARD_TOKEN secret: a fine-grained token with Contents: read and write on lnl-dashboard only.
name: dashboard
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['write next brief', 'voice', 'voice-takes', 'post next part']
    types: [requested, completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: dashboard
  cancel-in-progress: true
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: python scripts/dashboard.py --push
      - name: remember previews
        run: |
          git config user.name "lnl-stories bot"; git config user.email "actions@users.noreply.github.com"
          git add status/previews.json 2>/dev/null || true
          git commit -qm "Dashboard: preview links [skip ci]" || exit 0
          git pull --rebase -q origin main && git push -q
