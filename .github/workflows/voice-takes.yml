# Records alternate deliveries of one moment (voice_takes.py) so Rishi can pick the best one by ear.
name: voice-takes
run-name: "Takes ${{ inputs.series }} part ${{ inputs.part }}"
on:
  workflow_dispatch:
    inputs:
      series: {description: 'Series', required: true}
      part: {description: 'Part number', required: true}
      takes: {description: 'JSON list of {label, text, exag, cfg}', required: true}
permissions:
  contents: write
concurrency: voice
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: install
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q --fix-missing ffmpeg >/dev/null
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts faster-whisper
          git init -q $HOME/lemo && cd $HOME/lemo
          git fetch -q --depth 1 https://github.com/lemomo-ai/lemo-opuscar 00a7f9ec99c8686265a8ca4ed9a3fdaaf27ea6f4 && git checkout -q FETCH_HEAD
          cd $GITHUB_WORKSPACE/vendor/whisper-small.en && cat model.bin.part* > model.bin
      - name: takes
        env:
          LIB: /home/runner/lemo
          WHISPER_MODEL: ${{ github.workspace }}/vendor/whisper-small.en
          TAKES: ${{ inputs.takes }}
        run: python scripts/voice_takes.py "${{ inputs.series }}" "${{ inputs.part }}" "$TAKES"
      - name: save
        if: always()
        run: |
          git config user.name "lnl-stories bot"
          git config user.email "actions@users.noreply.github.com"
                    git add -f series/*/part*/voices/takes
          git commit -m "Voice: alternate takes" || echo "nothing new"
          git pull --rebase -q origin main && git push
